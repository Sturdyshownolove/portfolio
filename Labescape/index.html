<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Escape: Chemical Protocol</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div id="menu-screen" class="screen active">
            <h1>LAB ESCAPE</h1>
            <p class="subtitle">System Lockdown: Chemical Verification Required</p>
            <div class="level-select">
                <button class="cyber-btn" onclick="game.startLevel(1)">Level 1: Entry Room (Pairs)</button>
                <button class="cyber-btn" onclick="game.startLevel(2)">Level 2: Lab Room (Triplets)</button>
            </div>
            <div class="high-score">High Score: <span id="high-score-display">0</span></div>
        </div>

        <div id="game-screen" class="screen">
            <header class="game-header">
                <div class="stats">
                    <span>Level: <span id="level-display">1</span></span>
                    <span>Score: <span id="score-display">0</span></span>
                    <span>Time: <span id="time-display">00:00</span></span>
                </div>
                <button class="danger-btn" onclick="game.quitToMenu()">Abort</button>
            </header>
            
            <main class="grid-container" id="grid-container">
                </main>

            <footer class="story-footer">
                <p id="story-text">System booting... match chemicals to bypass security.</p>
            </footer>
        </div>

        <div id="result-screen" class="screen">
            <h2 id="result-title">ACCESS GRANTED</h2>
            <p id="result-message">Door unlocking...</p>
            <p>Final Score: <span id="final-score"></span></p>
            <button class="cyber-btn" onclick="game.quitToMenu()">Return to Terminal</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
